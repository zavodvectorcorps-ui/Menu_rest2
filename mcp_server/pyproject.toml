[project]
name = "restmenu-mcp"
version = "0.1.0"
description = "MCP-сервер для управления REST-MENU через Claude Desktop / Cursor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
restmenu-mcp = "restmenu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["restmenu_mcp"]
